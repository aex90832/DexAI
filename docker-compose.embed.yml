# Add this service to your existing compose file, then add the two EMBED_*
# variables to pokedex-api's environment.
#
# WHY: local CPU embedding measured 28 chunks/s at 16 threads, 36 at 64, and 33
# at 192 — nearly flat across a 12x thread range, so the bottleneck is serial
# Python work, not compute. At 734,541 chunks that is 5-7 hours. A GPU endpoint
# should bring it to minutes.

services:

  # ---------------------------------------------------------------------------
  # Embedding server. bge-small is 33M parameters — tiny next to a chat model,
  # so it coexists with your other GPU workloads without much VRAM pressure.
  #
  # This uses the stock ROCm vLLM image. If you would rather reuse your
  # vllm-radiance image, swap the `image:` line — the arguments are the same.
  # ---------------------------------------------------------------------------
  pokedex-embed:
    image: rocm/vllm:latest
    container_name: pokedex-embed
    command: >
      --model BAAI/bge-small-en-v1.5
      --task embed
      --port 8993
      --gpu-memory-utilization 0.10
      --max-model-len 512
      --disable-log-requests
    environment:
      HF_HOME: /data/models
      HIP_VISIBLE_DEVICES: "0"
    volumes:
      - /mnt/Apps/pokedex/data:/data
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    security_opt:
      - seccomp:unconfined
    ipc: host
    ports:
      - "8993:8993"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Then add to pokedex-api's environment:
  # ---------------------------------------------------------------------------
  #   EMBED_URL: http://pokedex-embed:8993/v1
  #   EMBED_API_KEY: ''
  #
  # Leave EMBED_MODEL as it is — the name must match what the server loads, and
  # it must be the SAME model the index was built with. Mixing backends of the
  # same model is usually fine, but mixing models silently ruins retrieval.

# ---------------------------------------------------------------------------
# OPTIONAL alternative: long-context embedding model for big GPUs.
#
# bge-small-en-v1.5 caps at 512 tokens, so roughly 15-25% of real Bulbapedia
# chunks (table-heavy sections especially) get truncated before embedding.
# Truncation still WORKS — ingest.py shrinks and retries automatically — but
# each retry is an extra round trip, and the truncated vector only represents
# part of the chunk's text.
#
# nomic-embed-text-v1.5 supports 8192 tokens, so those same chunks embed in
# full on the first request: fewer round trips, and a vector built from the
# whole chunk. It's a bigger model (137M vs 33M) but still small enough that a
# 24GB+ card (R9700, 5090, W7900, 4090) has plenty of headroom — this is
# firmly in "let a big GPU stretch its legs" territory, not a workload that
# needs one.
#
# Use EITHER this service OR the bge-small one above, not both at once — pick
# whichever EMBED_URL/EMBED_MODEL trio you point pokedex-api at.
#
# REQUIRES A FULL RE-EMBED if you switch after already building an index —
# vectors from two different models are not comparable and cannot mix in one
# index. Run `ingest.py --wiki-only` after switching.
#
# nomic-embed-text needs a task prefix on every text or retrieval quality
# degrades with no error — see EMBED_DOC_PREFIX / EMBED_QUERY_PREFIX below.
# ---------------------------------------------------------------------------
  pokedex-embed-longctx:
    command: >
      nomic-ai/nomic-embed-text-v1.5
      --runner pooling
      --port 8993
      --gpu-memory-utilization 0.10
      --max-model-len 8192
      --trust-remote-code
    container_name: pokedex-embed
    devices:
      - /dev/kfd
      - /dev/dri
    environment:
      HF_HOME: /data/models
      HIP_VISIBLE_DEVICES: '0'
      RADIANCE_USE_R4D_AR: '0'
      RADIANCE_USE_R4D_AR_QUANT: '0'
      RADIANCE_RUN_BWTEST: '0'
    group_add:
      - video
    image: stilldeadcode/vllm-radiance:0.9.3     # or rocm/vllm:latest if it starts on your card
    ipc: host
    ports:
      - '8993:8993'
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    volumes:
      - /mnt/Apps/pokedex/data:/data

# ---------------------------------------------------------------------------
# Then on pokedex-api, for the long-context model instead of bge-small:
# ---------------------------------------------------------------------------
#   EMBED_MODEL: nomic-ai/nomic-embed-text-v1.5
#   EMBED_URL: http://pokedex-embed:8993/v1
#   EMBED_API_KEY: ''
#   EMBED_TIER: gpu-big              # or gpu-small if the card is more modest
#   EMBED_DOC_PREFIX: 'search_document: '
#   EMBED_QUERY_PREFIX: 'search_query: '
#
# EMBED_DOC_PREFIX/EMBED_QUERY_PREFIX are only needed by models that document
# this convention — bge-small needs neither and both env vars can stay unset.
